services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: maintimatch
      POSTGRES_USER: maintimatch
      POSTGRES_PASSWORD: maintimatch
    ports:
      - "5432:5432"
    volumes:
      - maintimatch_pg:/var/lib/postgresql/data
volumes:
  maintimatch_pg:
